<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Recursos de prefectura</title>
<meta name="description" content="Esta página no existe o cambió de dirección. Vuelve al índice de recursos de prefectura.">
<meta name="theme-color" content="#FF6B4A">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --ink:#21232B;
    --ink-soft:#5B5B66;
    --paper:#FFF6E9;
    --card:#FFFFFF;
    --line:#EAD9C2;
    --coral:#FF6B4A;
    --coral-dark:#E24F30;
    --yellow:#FFC93C;
    --teal:#2FB8A6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--paper); color:var(--ink);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .topbar{position:fixed; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg, var(--coral), var(--yellow), var(--teal));}
  .card{background:var(--card); border-radius:24px; border:2.5px solid var(--ink); box-shadow:8px 8px 0 rgba(33,35,43,.08); padding:44px 36px; max-width:440px;}
  .brand-bar{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:18px;}
  .brand-mark{background:var(--teal); color:#fff; font-weight:800; font-size:12px; letter-spacing:.5px; padding:5px 10px; border-radius:10px;}
  .brand-name{color:var(--ink-soft); font-size:13px; font-weight:800;}
  .emoji{font-size:44px; margin-bottom:6px;}
  h1{font-weight:900; letter-spacing:-.5px; font-size:26px; margin:0 0 10px;}
  p{color:var(--ink-soft); font-size:15px; line-height:1.5; margin:0 0 20px;}
  a.cta{
    display:inline-block; background:var(--coral); color:#fff; text-decoration:none; font-weight:800;
    border:2.5px solid var(--ink); padding:12px 24px; border-radius:999px; font-size:14.5px;
  }
  a.cta:hover{background:var(--coral-dark);}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="card">
  <div class="brand-bar"><span class="brand-mark">DC·IA</span><span class="brand-name">Diseñar comunidad con IA</span></div>
  <div class="emoji">🧭</div>
  <h1>Esta página no existe</h1>
  <p>El enlace puede haber cambiado de dirección. Vuelve al índice para encontrar la plantilla que buscas.</p>
  <a class="cta" href="index.html">Ir al índice de recursos</a>
</div>
</body>
</html>
